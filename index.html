<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ZéroAbsolu — Duel Sémantique</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #070b14;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #appViewport {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-image:
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.10) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.10) 0px, transparent 50%);
    }

    .font-mono-num { font-family: 'JetBrains Mono', monospace; }

    /* Spectre thermique progressif : Gris -> Bleu -> Vert -> Violet -> Orange -> Rouge */
    .thermal-spectrum {
      background: linear-gradient(
        90deg,
        #64748b 0%,
        #0ea5e9 22%,
        #10b981 45%,
        #8b5cf6 68%,
        #f59e0b 85%,
        #f43f5e 100%
      );
    }

    /* Animations */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .animate-shake { animation: shake 0.35s cubic-bezier(.36,.07,.19,.97) both; }

    @keyframes duplicatePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); transform: scale(1); }
      50% { box-shadow: 0 0 0 4px rgba(244, 63, 94, 0.45); transform: scale(1.01); border-color: #f43f5e; }
    }
    .animate-duplicate { animation: duplicatePulse 0.75s ease-in-out 2; }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(4px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop { animation: popIn 0.2s ease-out forwards; }

    @keyframes surgeOverlayAnim {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1.04); }
      25% { transform: translate(-50%, -50%) scale(1); }
      85% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -60%) scale(0.95); }
    }
    .animate-surge-banner {
      animation: surgeOverlayAnim 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Défilement doux si un texte de bandeau est long sur petit écran */
    @keyframes marqueeScroll {
      0%, 20% { transform: translateX(0%); }
      80%, 100% { transform: translateX(calc(-100% + 220px)); }
    }
    .ticker-scroll {
      display: inline-block;
      white-space: nowrap;
      animation: marqueeScroll 7s ease-in-out infinite alternate;
    }

    /* Mode Clavier Mobile Actif : épure tout le superflu pour afficher un maximum de mots chauds */
    body.keyboard-active #mainHeader,
    body.keyboard-active #statsContainer,
    body.keyboard-active #mobileTabsWrapper,
    body.keyboard-active #lastGuessBox {
      display: none !important;
    }
    body.keyboard-active #mainGrid {
      padding-top: 0.2rem !important;
      padding-bottom: 0.2rem !important;
      gap: 0.3rem !important;
    }
    body.keyboard-active #gameSection {
      gap: 0.3rem !important;
    }

    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  </style>
</head>
<body class="text-slate-100 selection:bg-sky-500 selection:text-white">

  <div id="appViewport">

    <!-- ===================================================================== -->
    <!-- MODALE D'ACCUEIL (FERMABLE AU CLIC EXTÉRIEUR OU CROIX X)              -->
    <!-- ===================================================================== -->
    <div id="onboardingModal" onclick="handleModalBackdropClick(event)"
      class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
      <div class="relative bg-slate-900 border border-slate-800 rounded-3xl max-w-sm w-full p-5 sm:p-6 shadow-2xl animate-pop">

        <!-- Bouton Croix (X) pour fermer la carte et revenir au jeu -->
        <button id="closeModalBtn" onclick="closeOnboardingModal()" title="Fermer"
          class="hidden absolute top-4 right-4 w-8 h-8 rounded-full bg-slate-800/80 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>

        <div class="flex items-center gap-3 mb-4">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-sky-400 via-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-sky-500/20 shrink-0">
            <i data-lucide="thermometer-snowflake" class="w-5 h-5 text-white"></i>
          </div>
          <div>
            <h1 class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-sky-300 via-indigo-200 to-purple-300 bg-clip-text text-transparent">
              ZéroAbsolu
            </h1>
            <p class="text-[11px] text-slate-400">Trouvez le mot secret ensemble</p>
          </div>
        </div>

        <!-- Pseudo -->
        <div>
          <label class="block text-[11px] font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Pseudo</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input id="modalPseudo" type="text" maxlength="16" placeholder="Ex: Pierre"
              class="w-full bg-slate-950 border border-slate-800 focus:border-sky-500 rounded-xl pl-10 pr-4 py-2.5 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-sky-500/20 transition">
          </div>
        </div>

        <!-- Actions : Solo ou Créer -->
        <div class="grid grid-cols-2 gap-2.5 mt-4">
          <button onclick="startSoloMode()"
            class="flex flex-col items-center justify-center gap-1 bg-slate-800/80 hover:bg-slate-800 border border-slate-700/70 rounded-2xl p-3.5 transition group">
            <i data-lucide="compass" class="w-5 h-5 text-sky-400 group-hover:scale-110 transition"></i>
            <span class="text-xs font-bold">Solo</span>
          </button>

          <button onclick="startCreateRoom()"
            class="flex flex-col items-center justify-center gap-1 bg-gradient-to-br from-sky-600/90 to-indigo-600/90 hover:from-sky-500 hover:to-indigo-500 border border-sky-400/30 rounded-2xl p-3.5 transition shadow-lg shadow-sky-600/15 group">
            <i data-lucide="users" class="w-5 h-5 text-white group-hover:scale-110 transition"></i>
            <span class="text-xs font-bold">Créer Salon</span>
          </button>
        </div>

        <!-- Séparateur -->
        <div class="relative flex py-3.5 items-center">
          <div class="flex-grow border-t border-slate-800"></div>
          <span class="flex-shrink mx-3 text-[10px] text-slate-500 uppercase tracking-wider">Rejoindre un salon</span>
          <div class="flex-grow border-t border-slate-800"></div>
        </div>

        <!-- Code à 4 lettres + Bouton Rejoindre EN DESSOUS (Grisé tant que < 4 lettres) -->
        <div class="flex flex-col gap-2.5">
          <input id="modalRoomCode" type="text" maxlength="4" placeholder="CODE À 4 LETTRES" oninput="handleRoomCodeInput(this)"
            class="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 rounded-xl px-4 py-2.5 text-center font-mono-num text-base font-bold uppercase tracking-[0.3em] placeholder:tracking-normal placeholder:font-sans placeholder:text-xs placeholder:font-normal focus:outline-none transition">

          <button id="joinRoomBtn" onclick="startJoinRoom()" disabled
            class="w-full py-2.5 rounded-xl text-sm font-bold transition flex items-center justify-center gap-2 bg-slate-800 text-slate-500 cursor-not-allowed opacity-60">
            <span>Rejoindre le salon</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>
        </div>

        <p id="modalError" class="text-rose-400 text-xs mt-2 text-center min-h-[1rem]"></p>
      </div>
    </div>

    <!-- ===================================================================== -->
    <!-- ANIMATION CENTRALE DE « MONTÉE EN PUISSANCE »                         -->
    <!-- ===================================================================== -->
    <div id="surgeOverlay" class="hidden fixed top-1/2 left-1/2 z-40 pointer-events-none w-[88%] max-w-xs">
      <div class="bg-slate-950/95 border-2 border-amber-400/80 rounded-3xl p-4 shadow-[0_0_50px_rgba(245,158,11,0.45)] text-center backdrop-blur-xl">
        <div class="inline-flex items-center gap-1 bg-amber-500/20 border border-amber-400/40 text-amber-300 text-[10px] font-extrabold uppercase tracking-widest px-2.5 py-0.5 rounded-full mb-1.5">
          <span>🚀 Percée majeure</span>
        </div>
        <div id="surgePlayerName" class="text-xs font-bold text-sky-300">Pierre</div>
        <div id="surgeWord" class="text-xl font-extrabold text-white uppercase tracking-wide my-0.5">BATEAU</div>
        <div class="flex items-center justify-center gap-2 mt-1">
          <span id="surgeTemp" class="font-mono-num text-sm font-extrabold text-amber-400">70.5°C</span>
          <span id="surgeDelta" class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 font-mono-num text-[11px] font-bold px-2 py-0.5 rounded-lg">+28%</span>
        </div>
      </div>
    </div>

    <!-- ===================================================================== -->
    <!-- TOAST DE NOTIFICATION FLOTTANT                                        -->
    <!-- ===================================================================== -->
    <div id="toastContainer" class="fixed top-2.5 left-1/2 -translate-x-1/2 z-40 flex flex-col items-center gap-1.5 pointer-events-none w-full max-w-xs px-4"></div>

    <!-- ===================================================================== -->
    <!-- EN-TÊTE COMPACT                                                       -->
    <!-- ===================================================================== -->
    <header id="mainHeader" class="w-full max-w-6xl mx-auto px-3 sm:px-4 pt-2 pb-1.5 flex items-center justify-between gap-2 border-b border-slate-800/80 shrink-0">
      <div class="flex items-center gap-2">
        <button onclick="openOnboardingModal()" title="Menu Salon / Pseudo"
          class="w-8 h-8 rounded-xl bg-gradient-to-br from-sky-500 to-indigo-600 flex items-center justify-center shadow-md shadow-sky-500/10 hover:opacity-90 transition">
          <i data-lucide="thermometer-snowflake" class="w-4 h-4 text-white"></i>
        </button>
        <span class="font-extrabold text-sm sm:text-base tracking-tight">ZéroAbsolu</span>
        <span id="roundBadge" class="text-[11px] font-mono-num bg-sky-500/15 text-sky-300 px-1.5 py-0.5 rounded-md border border-sky-500/30 font-bold">#1</span>
      </div>

      <div class="flex items-center gap-1.5">
        <div class="flex items-center gap-1 bg-slate-900 border border-slate-800 px-2 py-1 rounded-lg" title="Vos points">
          <i data-lucide="zap" class="w-3 h-3 text-amber-400"></i>
          <span id="headerPoints" class="font-mono-num text-xs font-extrabold text-amber-400">0</span>
        </div>

        <button id="roomCodePill" onclick="copyRoomCode()" class="hidden items-center gap-1 bg-indigo-950/70 hover:bg-indigo-900/70 border border-indigo-500/40 px-2 py-1 rounded-lg transition">
          <strong id="headerRoomCode" class="font-mono-num text-xs font-bold tracking-widest text-white">----</strong>
          <i data-lucide="copy" class="w-3 h-3 text-indigo-400"></i>
        </button>

        <button id="hintBtn" onclick="useHint()"
          class="flex items-center gap-1 bg-slate-900/70 border border-slate-800 text-slate-500 text-xs font-semibold px-2 py-1 rounded-lg transition opacity-75">
          <span id="hintBtnContent" class="flex items-center gap-1">
            <i data-lucide="lock" class="w-3 h-3 text-slate-500"></i>
            <span class="font-mono-num text-[11px]">750</span>
          </span>
        </button>

        <button id="giveUpBtn" onclick="giveUpRound()" title="Révéler le mot"
          class="flex items-center bg-slate-900 hover:bg-rose-950/50 border border-slate-800 text-slate-400 hover:text-rose-300 p-1.5 rounded-lg transition">
          <i data-lucide="flag" class="w-3.5 h-3.5"></i>
        </button>

        <button id="nextGameBtn" onclick="triggerNextGame()" title="Manche suivante"
          class="flex items-center bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 p-1.5 rounded-lg transition">
          <i data-lucide="skip-forward" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </header>

    <!-- ===================================================================== -->
    <!-- BANDEAU DIRECT (AVEC DÉFILEMENT AUTO SI TEXTE LONG)                   -->
    <!-- ===================================================================== -->
    <div class="w-full max-w-6xl mx-auto px-3 sm:px-4 pt-1.5 shrink-0">
      <div class="bg-slate-900/90 border border-slate-800/90 rounded-xl px-2.5 py-1 flex items-center justify-between gap-2 text-xs">
        <div class="flex items-center gap-2 min-w-0 flex-1 overflow-hidden">
          <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
          <div class="overflow-hidden w-full">
            <span id="liveTickerText" class="text-slate-300 font-medium text-[11px] block truncate">Prêt — Proposez un mot !</span>
          </div>
        </div>
        <span id="liveLeaderBadge" class="shrink-0 font-mono-num text-[10px] text-amber-400 font-bold bg-amber-500/10 border border-amber-500/20 px-1.5 py-0.5 rounded">
          🥇 --
        </span>
      </div>
    </div>

    <!-- ===================================================================== -->
    <!-- ONGLETS MOBILES ÉPURÉS                                                -->
    <!-- ===================================================================== -->
    <div id="mobileTabsWrapper" class="lg:hidden w-full max-w-6xl mx-auto px-3 sm:px-4 pt-1.5 shrink-0">
      <div class="grid grid-cols-2 bg-slate-900/90 p-0.5 rounded-xl border border-slate-800 text-xs font-bold">
        <button id="tabGameBtn" onclick="switchMobileTab('game')" class="py-1 rounded-lg bg-slate-800 text-white transition flex items-center justify-center gap-1.5">
          <i data-lucide="flame" class="w-3.5 h-3.5 text-sky-400"></i>
          <span>Mots (<span id="mobileAttemptCount">0</span>)</span>
        </button>
        <button id="tabSocialBtn" onclick="switchMobileTab('social')" class="py-1 rounded-lg text-slate-400 transition flex items-center justify-center gap-1.5 relative">
          <i data-lucide="trophy" class="w-3.5 h-3.5 text-amber-400"></i>
          <span>Salon & Direct</span>
          <span id="unreadDot" class="hidden w-2 h-2 rounded-full bg-rose-500"></span>
        </button>
      </div>
    </div>

    <!-- ===================================================================== -->
    <!-- GRILLE PRINCIPALE                                                     -->
    <!-- ===================================================================== -->
    <main id="mainGrid" class="w-full max-w-6xl mx-auto flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 px-3 sm:px-4 py-1.5 min-h-0 overflow-hidden">

      <!-- COLONNE GAUCHE : ZONE DE JEU -->
      <section id="gameSection" class="lg:col-span-7 flex flex-col gap-1.5 min-h-0 h-full">

        <!-- STATISTIQUES MINIMISABLES (Se replie après 10s ou au clic) -->
        <div id="statsContainer" onclick="toggleStatsMinimized()" class="cursor-pointer select-none shrink-0 transition-all">
          <!-- Vue Dépliée -->
          <div id="statsExpanded" class="grid grid-cols-3 gap-1.5">
            <div class="bg-slate-900/70 border border-slate-800/80 rounded-xl px-2.5 py-1.5 flex items-center justify-between">
              <span class="text-[10px] text-slate-400">Mots</span>
              <span id="statAttempts" class="font-mono-num text-xs font-bold text-white">0</span>
            </div>
            <div class="bg-slate-900/70 border border-slate-800/80 rounded-xl px-2.5 py-1.5 flex items-center justify-between">
              <span class="text-[10px] text-slate-400">Record</span>
              <span id="statBestTemp" class="font-mono-num text-xs font-bold text-sky-400">--°C</span>
            </div>
            <div class="bg-slate-900/70 border border-slate-800/80 rounded-xl px-2.5 py-1.5 flex items-center justify-between">
              <span class="text-[10px] text-slate-400">Top 1000</span>
              <span id="statTopWords" class="font-mono-num text-xs font-bold text-amber-400">0</span>
            </div>
          </div>
          <!-- Vue Minimisée (Barre fine) -->
          <div id="statsCollapsed" class="hidden bg-slate-900/50 border border-slate-800/60 rounded-lg px-2.5 py-1 flex items-center justify-between text-[11px] text-slate-400">
            <div class="flex items-center gap-3 font-mono-num">
              <span>Mots: <strong id="miniAttempts" class="text-slate-200">0</strong></span>
              <span>Record: <strong id="miniBestTemp" class="text-sky-400">--°C</strong></span>
              <span>Top: <strong id="miniTopWords" class="text-amber-400">0</strong></span>
            </div>
            <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-500"></i>
          </div>
        </div>

        <!-- Barre de Saisie -->
        <form id="guessForm" onsubmit="handleGuess(event)" class="relative flex gap-1.5 shrink-0">
          <div class="relative flex-1">
            <input id="wordInput" type="text" inputmode="text" enterkeyhint="send"
              placeholder="Proposer un mot..." autocomplete="off" autocapitalize="none" spellcheck="false"
              class="w-full bg-slate-900 border border-slate-700/90 focus:border-sky-500 rounded-xl pl-3 pr-8 py-2 text-base font-medium placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500/20 transition">
            <button type="button" onclick="clearInput()" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 p-1">
              <i data-lucide="x" class="w-4 h-4"></i>
            </button>
          </div>
          <button type="submit"
            class="bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 active:scale-[0.98] font-bold px-4 sm:px-5 rounded-xl text-sm transition shadow-lg shadow-sky-600/20 flex items-center gap-1 shrink-0">
            <span>OK</span>
            <i data-lucide="corner-down-left" class="w-3.5 h-3.5 hidden sm:inline"></i>
          </button>
        </form>

        <!-- Bannière de Fin de Manche -->
        <div id="victoryBanner" class="hidden bg-gradient-to-r from-emerald-950/90 via-teal-950/90 to-slate-900 border border-emerald-500/40 rounded-xl p-2.5 animate-pop shrink-0">
          <div class="flex items-center justify-between gap-2">
            <div class="min-w-0">
              <h3 id="victoryTitle" class="text-xs sm:text-sm font-extrabold text-white truncate">Mot trouvé !</h3>
              <p id="victorySub" class="text-[11px] text-slate-300 truncate"></p>
            </div>
            <button onclick="triggerNextGame()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs px-3 py-1.5 rounded-lg transition shrink-0">
              Suivant
            </button>
          </div>
        </div>

        <!-- Dernier Essai Ultra-Compact -->
        <div id="lastGuessBox" class="hidden shrink-0">
          <div id="lastGuessContent"></div>
        </div>

        <!-- Liste Commune des Mots Chauds -->
        <div class="bg-slate-900/60 border border-slate-800/90 rounded-2xl p-2 sm:p-2.5 flex-1 flex flex-col min-h-0 overflow-hidden">
          <div class="flex justify-between items-center text-[11px] text-slate-400 border-b border-slate-800 pb-1.5 mb-1.5 shrink-0 px-0.5">
            <span class="font-bold text-slate-300">🔥 Mots chauds</span>
            <div class="flex items-center gap-1.5">
              <div class="w-12 h-1.5 rounded-full thermal-spectrum"></div>
              <span class="text-[10px] text-slate-500">Temp.</span>
            </div>
          </div>
          <div id="guessesList" class="flex-1 overflow-y-auto flex flex-col gap-1 pr-0.5">
            <p class="text-slate-500 text-xs text-center my-auto py-8">Chargement...</p>
          </div>
        </div>

      </section>

      <!-- COLONNE DROITE : JOUEURS & DIRECT ÉPURÉ -->
      <aside id="socialSection" class="hidden lg:flex lg:col-span-5 flex-col gap-2.5 min-h-0 h-full">

        <!-- Classement des joueurs -->
        <div class="bg-slate-900/60 border border-slate-800/90 rounded-2xl p-3 shrink-0">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-2">
            <div class="flex items-center gap-1.5">
              <i data-lucide="trophy" class="w-3.5 h-3.5 text-amber-400"></i>
              <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300">Joueurs</h2>
            </div>
            <span id="playerCountBadge" class="text-[10px] bg-sky-500/15 text-sky-300 px-2 py-0.5 rounded-full font-semibold">
              1
            </span>
          </div>
          <div id="leaderboardList" class="flex flex-col gap-1.5 max-h-40 overflow-y-auto pr-0.5"></div>
        </div>

        <!-- Journal Direct Structuré & Filtrable -->
        <div class="bg-slate-900/60 border border-slate-800/90 rounded-2xl p-3 flex-1 flex flex-col min-h-0 overflow-hidden">
          <div class="flex items-center justify-between border-b border-slate-800 pb-2 mb-2 shrink-0">
            <div class="flex items-center gap-1.5">
              <i data-lucide="radio" class="w-3.5 h-3.5 text-sky-400"></i>
              <h2 class="font-bold text-xs uppercase tracking-wider text-slate-300">Direct</h2>
            </div>
            <!-- Filtre anti-pollution : Tout vs Chauds uniquement -->
            <button id="feedFilterBtn" onclick="toggleFeedFilter()"
              class="text-[10px] font-semibold px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 transition">
              Tout afficher
            </button>
          </div>
          <div id="liveFeed" class="flex-1 overflow-y-auto flex flex-col gap-1 pr-0.5 text-xs"></div>
        </div>

      </aside>

    </main>

  </div>

  <script>
    // =========================================================================
    // 1. CONFIGURATION & ÉTAT GLOBAL
    // =========================================================================
    const TOTAL_GAMES = 500;
    const HINT_COST = 750;
    const PEER_PREFIX = "zeroabsolu-fr-v2-";

    const FALLBACK_WORDS = {
      "océan": [100.0, 1000], "mer": [92.4, 999], "maritime": [86.1, 998], "atlantique": [84.5, 997],
      "pacifique": [83.2, 996], "vague": [78.9, 995], "navire": [76.4, 994], "marin": [75.1, 993],

    // =========================================================================
    // 3. RECONNAISSANCE MORPHOLOGIQUE (FÉMININS, PLURIELS, TIRETS)
    // =========================================================================
    function buildAccentInsensitiveIndex() {
      accentInsensitiveMap = {};
      for (const word of Object.keys(gameDictionary)) {
        const stripped = stripAccents(word);
        if (!(stripped in accentInsensitiveMap) || word === stripped) {
          accentInsensitiveMap[stripped] = word;
        }
        if (word.includes("-")) {
          accentInsensitiveMap[stripped.replace(/-/g, "")] = word;
        }
      }
    }

    function tryDirectMatch(candidate) {
      if (candidate in gameDictionary) return candidate;
      const stripped = stripAccents(candidate);
      if (stripped in accentInsensitiveMap) return accentInsensitiveMap[stripped];
      return null;
    }

    function resolveWordInDictionary(rawInput) {
      const cleaned = rawInput.trim().toLowerCase().replace(/\s+/g, "-");
      let match = tryDirectMatch(cleaned);
      if (match) return match;

      const baseForms = [cleaned];
      if (cleaned.endsWith("s") && cleaned.length > 3) baseForms.push(cleaned.slice(0, -1));
      if (cleaned.endsWith("x") && cleaned.length > 3) baseForms.push(cleaned.slice(0, -1));

      const suffixRules = [
        ["aux", "al"], ["euse", "eur"], ["rice", "eur"], ["trice", "teur"],
        ["ive", "if"], ["ienne", "ien"], ["onne", "on"], ["elle", "el"],
        ["elle", "eau"], ["ère", "er"], ["ere", "er"], ["ette", "et"],
        ["otte", "ot"], ["e", ""], ["ée", "er"], ["é", "er"],
        ["és", "er"], ["ées", "er"], ["er", "e"]
      ];

      for (const form of baseForms) {
        match = tryDirectMatch(form);
        if (match) return match;

        for (const [ending, replacement] of suffixRules) {
          if (form.endsWith(ending) && form.length - ending.length >= 2) {
            const stem = form.slice(0, form.length - ending.length) + replacement;
            match = tryDirectMatch(stem);
            if (match) return match;
          }
        }
      }
      return null;
    }

    // =========================================================================
    // 4. CALCUL DE PROXIMITÉ & DÉTECTION « MONTÉE EN PUISSANCE »
    // =========================================================================
    function computeProximityPct(temp, rank) {
      if (rank === 1000) return 100;
      if (rank !== null && rank > 0) {
        return 38 + (rank / 1000) * 61.5;
      }
      const normalizedCold = Math.max(0, Math.min(1, (temp + 10) / 38));
      return 4 + normalizedCold * 33;
    }

    function checkPowerSurge(temp, rank, newPct) {
      if (rank === 1000 || guesses.length < 2 || roomBestTemp === null) return null;

      const prevTemp = roomBestTemp;
      const prevPct = roomBestProximityPct;
      const prevRank = roomBestRank;

      const relTempGain = prevTemp > 5 ? ((temp - prevTemp) / prevTemp) * 100 : (temp - prevTemp) * 4;
      const pctJump = newPct - prevPct;
      const milestoneHit = (rank >= 990 && prevRank < 990) || (rank >= 900 && prevRank < 750);

      if (temp > prevTemp && temp >= 18 && (relTempGain >= 20 || pctJump >= 14 || milestoneHit)) {
        return Math.max(20, Math.min(99, Math.round(Math.max(relTempGain, pctJump * 1.5))));
      }
      return null;
    }

      disconnectMultiplayer();

      isHost = true;

      roomCode = generate4LetterCode();

      // Copie immédiate dans le presse-papiers pendant l'interaction utilisateur
      if (navigator.clipboard) {
        navigator.clipboard.writeText(roomCode).catch(() => {});
      }

      const fullPeerId = PEER_PREFIX + roomCode;
      document.getElementById("modalError").textContent = "Création...";
      peer = new Peer(fullPeerId);

      peer.on("open", () => {
        document.getElementById("modalError").textContent = "";

        showToast(`📋 Salon ${roomCode} créé et copié !`, "emerald");
      });

      peer.on("connection", (conn) => {
        hostConnections.push(conn);
        conn.on("data", (data) => handleHostReceivedData(conn, data));
        conn.on("close", () => {
          hostConnections = hostConnections.filter(c => c !== conn);
          if (conn.playerId && players[conn.playerId]) {
            const leftName = players[conn.playerId].pseudo;
            delete players[conn.playerId];
            broadcastFromHost({
              type: "STATE_SYNC",
              gameId: currentGameId,
              roundNumber,
              players,
              guesses,
              roomBestTemp,
              roomBestRank,
              roomBestProximityPct
            });
            addSystemFeedEvent(`${leftName} a quitté`);
            renderLeaderboard();
          }
        });
      });

      peer.on("error", (err) => {
        if (err.type === "unavailable-id") {

          document.getElementById("modalError").textContent = "Erreur réseau.";

    function startJoinRoom() {
      if (!validatePseudoInput()) return;
      const rawCode = document.getElementById("modalRoomCode").value.trim().toUpperCase();
      const err = document.getElementById("modalError");

      if (!/^[A-Z]{4}$/.test(rawCode)) return;

      disconnectMultiplayer();
      isHost = false;
      roomCode = rawCode;
      err.textContent = `Connexion à ${roomCode}...`;

      peer = new Peer();
      peer.on("open", () => {
        const conn = peer.connect(PEER_PREFIX + roomCode, { reliable: true });
        clientConnection = conn;

        const timeout = setTimeout(() => {
          if (!conn.open) err.textContent = `Salon "${roomCode}" introuvable.`;
        }, 5000);

        conn.on("open", () => {
          clearTimeout(timeout);
          err.textContent = "";
          updateRoomHeaderUI();
          closeOnboardingModal();
          conn.send({ type: "JOIN", player: players[myId] });
          showToast(`Connecté à ${roomCode} !`, "sky");
        });

        conn.on("data", (data) => handleClientReceivedData(data));
        conn.on("close", () => {
          showToast("Salon fermé par l'hôte.", "rose");
          startSoloMode();
        });
      });
    }

    function handleHostReceivedData(conn, data) {
      if (data.type === "JOIN" && data.player) {
        conn.playerId = data.player.id;
        players[data.player.id] = {
          id: data.player.id,
          pseudo: String(data.player.pseudo || "Pierre").substring(0, 16),
          points: Number(data.player.points) || 0,
          wins: Number(data.player.wins) || 0,
          bestTemp: null,
          bestRank: 0,
          attempts: 0
        };
        const joinMsg = `👋 ${players[data.player.id].pseudo} a rejoint`;
        broadcastFromHost({
          type: "STATE_SYNC",
          gameId: currentGameId,
          roundNumber,
          players,
          guesses,
          roomBestTemp,
          roomBestRank,
          roomBestProximityPct,
          joinText: joinMsg
        });
        renderLeaderboard();
        addSystemFeedEvent(joinMsg);
        updateLiveTicker(joinMsg);
      } else if (data.type === "SHARED_GUESS") {
        applySharedGuess(data, false);
        broadcastFromHost(data);
      }
    }

    function handleClientReceivedData(data) {
      if (data.type === "STATE_SYNC") {
        players = data.players || players;
        roomBestTemp = data.roomBestTemp ?? roomBestTemp;
        roomBestRank = data.roomBestRank || 0;
        roomBestProximityPct = data.roomBestProximityPct || 0;

        if (data.gameId && data.gameId !== currentGameId) {
          loadGame(data.gameId, data.roundNumber || roundNumber, data.guesses || []);
        } else {
          if (data.roundNumber) {
            roundNumber = data.roundNumber;
            document.getElementById("roundBadge").textContent = `#${roundNumber}`;
          }
          if (Array.isArray(data.guesses)) {
            guesses = data.guesses;
            renderGuesses();
            updateStatsUI();
          }
        }
        if (data.joinText) {
          addSystemFeedEvent(data.joinText);
          updateLiveTicker(data.joinText);
        }
        renderLeaderboard();
      } else if (data.type === "NEW_ROUND") {
        players = data.players || players;
        loadGame(data.gameId, data.roundNumber, []);
        renderLeaderboard();
      } else if (data.type === "ROUND_GIVEN_UP") {
        roundFinished = true;
        showVictoryBanner("Abandon", data.secretWord, guesses.length, true);
        addSystemFeedEvent(`🏳️ Mot révélé : ${data.secretWord.toUpperCase()}`);
        updateLiveTicker(`🏳️ Réponse : ${data.secretWord.toUpperCase()}`);
      } else if (data.type === "SHARED_GUESS") {
        if (data.playerId !== myId) {
          applySharedGuess(data, false);
        }
      }
    }

    function sendGuessToNetwork(payload) {
      if (!roomCode) return;
      if (isHost) broadcastFromHost(payload);
      else if (clientConnection && clientConnection.open) clientConnection.send(payload);

    function broadcastFromHost(payload) {
      hostConnections.forEach(c => { if (c.open) c.send(payload); });

    // =========================================================================
    // 6. CHARGEMENT DE MANCHE & VALIDATION COMMUNE
    // =========================================================================
    async function loadGame(gameId, displayRound = roundNumber, initialGuesses = []) {
      currentGameId = gameId;
      roundNumber = displayRound;
      guesses = initialGuesses;
      roundFinished = false;
      roomBestTemp = null;
      roomBestRank = 0;
      roomBestProximityPct = 0;

      Object.values(players).forEach(p => {
        p.bestTemp = null;
        p.bestRank = 0;
        p.attempts = 0;
      });

      document.getElementById("roundBadge").textContent = `#${roundNumber}`;
      document.getElementById("lastGuessBox").classList.add("hidden");
      document.getElementById("victoryBanner").classList.add("hidden");
      updateStatsUI();
      updateHintButtonUI();
      renderLeaderboard();

      document.getElementById("guessesList").innerHTML = `
        <div class="text-slate-400 text-xs text-center my-auto py-8 flex flex-col items-center gap-2">
          <div class="w-4 h-4 border-2 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
          <span>Manche #${roundNumber}...</span>
        </div>`;

      try {
        const res = await fetch(`parties/partie_${gameId}.json`);
        if (!res.ok) throw new Error("Fichier non trouvé");
        const data = await res.json();
        gameDictionary = data.words;
        buildAccentInsensitiveIndex();
      } catch (err) {
        gameDictionary = FALLBACK_WORDS;
        buildAccentInsensitiveIndex();
      }

      if (guesses.length > 0) {
        renderGuesses();
        updateStatsUI();
      } else {
        document.getElementById("guessesList").innerHTML = `
          <p class="text-slate-500 text-xs text-center my-auto py-8">
            Manche #${roundNumber} prête • Tapez un premier mot !
          </p>`;
      }
      updateLiveTicker(roomCode ? `Salon ${roomCode} • Manche #${roundNumber}` : `Manche #${roundNumber} en cours`);
    }

    function handleGuess(e) {
      e.preventDefault();
      const input = document.getElementById("wordInput");
      const form = document.getElementById("guessForm");
      const rawText = input.value.trim();

      if (!rawText) return;

      const resolvedWord = resolveWordInDictionary(rawText);

      if (!resolvedWord) {
        vibrateDevice(40);
        triggerInputShake(form);
        showToast(`« ${rawText.toLowerCase()} » inconnu`, "rose");
        return;
      }

      const existing = guesses.find(g => g.word === resolvedWord);
      if (existing) {
        input.value = "";
        vibrateDevice([30, 50, 30]);
        triggerInputShake(form);
        const who = existing.finderId === myId ? "vous" : existing.finderPseudo;
        showToast(`Déjà trouvé par ${who} (#${existing.num})`, "rose");
        renderLastGuess(existing);
        highlightExistingWordRow(resolvedWord);
        return;
      }

      input.value = "";

      const entry = gameDictionary[resolvedWord];
      const temp = Array.isArray(entry) ? entry[0] : entry;
      const rank = Array.isArray(entry) ? entry[1] : null;
      const isWin = rank === 1000;
      const isTop10 = rank !== null && rank >= 990 && rank < 1000;
      const proximityPct = computeProximityPct(temp, rank);

      const surgeGain = checkPowerSurge(temp, rank, proximityPct);

      let pointsEarned = 0;
      let isNewRecord = false;

      if (!roundFinished) {
        if (isWin) pointsEarned += 200;
        else if (isTop10) pointsEarned += 75;
        else if (rank >= 900) pointsEarned += 30;
        else if (rank !== null) pointsEarned += 10;

        if ((rank !== null && rank > roomBestRank) || (roomBestRank === 0 && (roomBestTemp === null || temp > roomBestTemp))) {
          if (!isWin) {
            isNewRecord = true;
            pointsEarned += 25;
          }
        }
      }

      const me = players[myId];
      me.attempts = (me.attempts || 0) + 1;
      me.points += pointsEarned;
      if (me.bestTemp === null || temp > me.bestTemp) me.bestTemp = temp;
      if (rank && rank > me.bestRank) me.bestRank = rank;
      if (isWin && !roundFinished) me.wins += 1;

      saveLocalProgress();
      updateHintButtonUI();

      const sharedPayload = {
        type: "SHARED_GUESS",
        playerId: myId,
        pseudo: me.pseudo,
        word: resolvedWord,
        temp,
        rank,
        proximityPct,
        isWin,
        isTop10,
        isNewRecord,
        surgeGain,
        pointsEarned,
        totalPoints: me.points,
        totalWins: me.wins,
        bestTemp: me.bestTemp,
        bestRank: me.bestRank,
        playerAttempts: me.attempts
      };

      applySharedGuess(sharedPayload, true);
      sendGuessToNetwork(sharedPayload);
    }

    function applySharedGuess(data, isLocal) {
      if (guesses.some(g => g.word === data.word)) return;

      const p = players[data.playerId] || { id: data.playerId, pseudo: data.pseudo, points: 0, wins: 0 };
      p.pseudo = data.pseudo;
      p.points = data.totalPoints;
      p.wins = data.totalWins;
      p.bestTemp = data.bestTemp;
      p.bestRank = data.bestRank;
      p.attempts = data.playerAttempts;
      players[data.playerId] = p;

      if (roomBestTemp === null || data.temp > roomBestTemp) roomBestTemp = data.temp;
      if (data.rank && data.rank > roomBestRank) roomBestRank = data.rank;
      if (data.proximityPct > roomBestProximityPct) roomBestProximityPct = data.proximityPct;

      const guessObj = {
        num: guesses.length + 1,
        word: data.word,
        temp: data.temp,
        rank: data.rank,
        proximityPct: data.proximityPct,
        isWin: data.isWin,
        isTop10: data.isTop10,
        finderId: data.playerId,
        finderPseudo: data.pseudo
      };

      guesses.push(guessObj);
      guesses.sort((a, b) => b.temp - a.temp);

      renderLastGuess(guessObj);
      renderGuesses(data.word);
      updateStatsUI();
      renderLeaderboard();
      resetStatsIdleTimer();

      if (guesses.indexOf(guessObj) < 4) {
        document.getElementById("guessesList").scrollTop = 0;
      }

      // Ajout propre et compact dans le journal Direct
      addWordFeedEvent(guessObj, data.surgeGain, data.isNewRecord);

      if (data.surgeGain) {
        triggerSurgeAnimation(data.pseudo, data.word, data.temp, data.surgeGain);
        updateLiveTicker(`🚀 ${data.pseudo} : ${data.word.toUpperCase()} (${data.temp.toFixed(1)}°C • +${data.surgeGain}%)`);
      } else if (data.isTop10 && isLocal) {
        showToast(`🔥 TOP ${1000 - data.rank} !`, "amber");
      }

      if (data.isWin) {
        roundFinished = true;
        updateHintButtonUI();
        triggerVictoryConfetti();
        showVictoryBanner(data.pseudo, data.word, guesses.length, false);
        updateLiveTicker(`🏆 ${data.pseudo} a trouvé ${data.word.toUpperCase()} !`);
      } else if (data.isNewRecord && !data.surgeGain) {
        updateLiveTicker(`🔥 Record par ${data.pseudo} : ${data.word} (${data.temp.toFixed(1)}°C)`);
      }
    }

    // =========================================================================
    // 7. INDICE & ABANDON
    // =========================================================================
    function useHint() {
      if (roundFinished) return;

      const me = players[myId];
      if (!me || me.points < HINT_COST) {
        const missing = HINT_COST - (me?.points || 0);
        vibrateDevice(50);
        triggerInputShake(document.getElementById("hintBtn"));
        showToast(`🔒 Il manque ${missing} pts (Coût : ${HINT_COST})`, "rose");
        return;
      }

      const targetRank = roomBestRank > 0 ? Math.min(998, Math.floor((roomBestRank + 1000) / 2)) : 600;
      const guessedSet = new Set(guesses.map(g => g.word));
      let bestCandidate = null;
      let minDiff = 9999;

      for (const [w, val] of Object.entries(gameDictionary)) {
        if (Array.isArray(val) && val[1] < 1000 && !guessedSet.has(w)) {
          const diff = Math.abs(val[1] - targetRank);
          if (diff < minDiff) {
            minDiff = diff;
            bestCandidate = w;
          }
        }
      }

      if (!bestCandidate) return;

      me.points -= HINT_COST;
      saveLocalProgress();
      updateHintButtonUI();

      document.getElementById("wordInput").value = bestCandidate;
      showToast(`💡 Indice : « ${bestCandidate} »`, "amber");
      handleGuess(new Event("submit"));
    }

    function findSecretWordInDict() {
      for (const [w, val] of Object.entries(gameDictionary)) {
        if (Array.isArray(val) && val[1] === 1000) return w;
      }
      return "inconnu";
    }

    function giveUpRound() {
      if (roundFinished) return;
      if (roomCode && !isHost) {
        showToast("Seul l'hôte peut révéler le mot.", "amber");
        return;
      }
      const secret = findSecretWordInDict();
      roundFinished = true;
      updateHintButtonUI();
      showVictoryBanner("Abandon", secret, guesses.length, true);
      addSystemFeedEvent(`🏳️ Mot révélé : ${secret.toUpperCase()}`);
      updateLiveTicker(`🏳️ Réponse : ${secret.toUpperCase()}`);

      if (roomCode && isHost) {
        broadcastFromHost({ type: "ROUND_GIVEN_UP", secretWord: secret });
      }
    }

    function triggerNextGame() {
      if (roomCode && !isHost) {
        showToast("Seul l'hôte peut changer de manche.", "amber");
        return;
      }
      const nextId = pickUnplayedGameId();
      const nextRound = roundNumber + 1;
      loadGame(nextId, nextRound, []);
      if (roomCode && isHost) {
        broadcastFromHost({
          type: "NEW_ROUND",
          gameId: nextId,
          roundNumber: nextRound,
          players
        });
      }
    }

    // =========================================================================
    // 8. RENDU ÉPURÉ (MOTS, BARRE SPECTRALE, DIRECT COMPACT)
    // =========================================================================
    function triggerInputShake(element) {
      if (!element) return;
      element.classList.remove("animate-shake");
      void element.offsetWidth;
      element.classList.add("animate-shake");
    }

    function highlightExistingWordRow(word) {
      const row = document.querySelector(`[data-word="${CSS.escape(word)}"]`);
      if (row) {
        row.scrollIntoView({ behavior: "smooth", block: "nearest" });
        row.classList.remove("animate-duplicate");
        void row.offsetWidth;
        row.classList.add("animate-duplicate");
      }
    }

    function triggerVictoryConfetti() {
      if (typeof confetti !== "function") return;
      const duration = 2200;
      const end = Date.now() + duration;

      (function frame() {
        confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0, y: 0.65 } });
        confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1, y: 0.65 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();
    }

    function showVictoryBanner(winnerPseudo, secretWord, totalAttempts, isGiveUp = false) {
      const banner = document.getElementById("victoryBanner");
      banner.classList.remove("hidden");
      document.getElementById("victoryTitle").textContent = `Réponse : ${secretWord.toUpperCase()}`;
      document.getElementById("victorySub").textContent = isGiveUp
        ? "Manche révélée"
        : `Trouvé par ${winnerPseudo} (${totalAttempts} mots)`;
    }

    function renderRowHTML(g, isHighlighted = false) {
      const width = Math.max(4, Math.min(100, g.proximityPct || computeProximityPct(g.temp, g.rank)));
      const clipRight = (100 - width).toFixed(1);

      let badgeHTML = "";
      if (g.isWin) {
        badgeHTML = `<span class="bg-emerald-500/20 text-emerald-300 text-[10px] font-bold px-1.5 py-0.2 rounded">🏆</span>`;
      } else if (g.isTop10) {
        badgeHTML = `<span class="bg-rose-500/25 text-rose-200 text-[10px] font-extrabold px-1.5 py-0.2 rounded">TOP ${1000 - g.rank}</span>`;
      } else if (g.rank) {
        badgeHTML = `<span class="bg-purple-500/15 text-purple-300 text-[10px] font-semibold px-1.5 py-0.2 rounded">${g.rank}‰</span>`;
      }

      const isMe = g.finderId === myId;
      const authorColor = isMe ? "text-sky-400" : "text-indigo-300";

      const borderClass = g.isTop10
        ? "border-rose-500/50 bg-rose-950/15"
        : g.isWin
          ? "border-emerald-500/50 bg-emerald-950/20"
          : isHighlighted
            ? "border-sky-500/40 bg-slate-800/80"
            : "border-slate-800/70 bg-slate-800/35";

      return `
        <div data-word="${escapeHTML(g.word)}" class="rounded-xl px-2.5 py-1.5 border ${borderClass} flex flex-col gap-1 transition-all shrink-0">
          <div class="flex justify-between items-center text-xs gap-2">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="text-slate-500 font-mono-num text-[10px]">#${g.num}</span>
              <strong class="capitalize truncate text-slate-100">${escapeHTML(g.word)}</strong>
              <span class="text-[10px] ${authorColor} truncate max-w-[75px]">• ${escapeHTML(g.finderPseudo || "Joueur")}</span>
            </div>
            <div class="flex items-center gap-1.5 shrink-0">
              ${badgeHTML}
              <span class="font-mono-num font-bold text-xs">${g.temp.toFixed(1)}°C</span>
            </div>
          </div>
          <div class="w-full bg-slate-950 h-1.5 rounded-full overflow-hidden">
            <div class="w-full h-full thermal-spectrum transition-all duration-500"
                 style="clip-path: inset(0 ${clipRight}% 0 0 round 9999px);"></div>
          </div>
        </div>
      `;
    }

    function renderLastGuess(g) {
      const box = document.getElementById("lastGuessBox");
      box.classList.remove("hidden");
      document.getElementById("lastGuessContent").innerHTML = renderRowHTML(g, true);
    }

    function renderGuesses(latestWord = "") {
      const list = document.getElementById("guessesList");
      list.innerHTML = guesses.map(g => renderRowHTML(g, g.word === latestWord)).join("");
    }

    function updateStatsUI() {
      const total = guesses.length;
      const bestStr = roomBestTemp !== null ? `${roomBestTemp.toFixed(1)}°C` : "--°C";
      const topCount = guesses.filter(g => g.rank !== null).length;

      document.getElementById("statAttempts").textContent = total;
      document.getElementById("mobileAttemptCount").textContent = total;
      document.getElementById("statBestTemp").textContent = bestStr;
      document.getElementById("statTopWords").textContent = topCount;

      document.getElementById("miniAttempts").textContent = total;
      document.getElementById("miniBestTemp").textContent = bestStr;
      document.getElementById("miniTopWords").textContent = topCount;
    }

    function updateLiveTicker(message) {
      const el = document.getElementById("liveTickerText");
      el.textContent = message;
      // Active l'animation de défilement uniquement si le texte dépasse sur petit écran
      if (message.length > 34 && window.innerWidth < 640) {
        el.className = "text-slate-300 font-medium text-[11px] ticker-scroll";
      } else {
        el.className = "text-slate-300 font-medium text-[11px] block truncate";
      }
    }

    function renderLeaderboard() {
      const list = document.getElementById("leaderboardList");
      const allPlayers = Object.values(players);

      const sortedByPoints = [...allPlayers].sort((a, b) => (b.points - a.points) || (b.wins - a.wins));
      const roundLeader = [...allPlayers].sort((a, b) => (b.bestRank - a.bestRank) || ((b.bestTemp ?? -999) - (a.bestTemp ?? -999)))[0];

      if (roundLeader && (roundLeader.bestRank > 0 || roundLeader.bestTemp !== null)) {
        const scoreStr = roundLeader.bestRank ? `${roundLeader.bestRank}‰` : `${roundLeader.bestTemp.toFixed(1)}°C`;
        document.getElementById("liveLeaderBadge").textContent = `🥇 ${roundLeader.pseudo} (${scoreStr})`;
      } else {
        document.getElementById("liveLeaderBadge").textContent = `🥇 ${sortedByPoints[0]?.pseudo || "--"}`;
      }

      document.getElementById("playerCountBadge").textContent = `${sortedByPoints.length}`;

      list.innerHTML = sortedByPoints.map((p, idx) => {
        const isMe = p.id === myId;
        const medal = idx === 0 ? "🥇" : idx === 1 ? "🥈" : idx === 2 ? "🥉" : `${idx + 1}.`;
        const bestInfo = p.bestRank
          ? `🔥 ${p.bestRank}‰`
          : p.bestTemp !== null && p.bestTemp !== undefined
            ? `${p.bestTemp.toFixed(1)}°C`
            : "--";

        return `
          <div class="flex items-center justify-between px-2.5 py-1.5 rounded-xl border ${isMe ? "bg-sky-950/30 border-sky-500/40" : "bg-slate-800/40 border-slate-800"}">
            <div class="flex items-center gap-2 min-w-0">
              <span class="text-xs font-bold w-4 text-center">${medal}</span>
              <div class="min-w-0">
                <span class="font-bold text-xs text-white truncate block">${escapeHTML(p.pseudo)}</span>
                <span class="text-[10px] text-slate-400">${bestInfo} • ${p.attempts || 0} essais</span>
              </div>
            </div>
            <div class="text-right shrink-0">
              <div class="font-mono-num text-xs font-extrabold text-amber-400">${p.points} pts</div>
              <div class="text-[10px] text-slate-400">🏆 ${p.wins}</div>
            </div>
          </div>
        `;
      }).join("");
    }

    // =========================================================================
    // 9. JOURNAL DIRECT ULTRA-LISIBLE & FILTRABLE
    // =========================================================================
    function toggleFeedFilter() {
      feedOnlyHot = !feedOnlyHot;
      const btn = document.getElementById("feedFilterBtn");
      btn.textContent = feedOnlyHot ? "🔥 Chauds seuls" : "Tout afficher";
      btn.className = feedOnlyHot
        ? "text-[10px] font-bold px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-300 border border-amber-500/30 transition"
        : "text-[10px] font-semibold px-2 py-0.5 rounded-md bg-slate-800 text-slate-300 hover:bg-slate-700 transition";
      renderFeed();
    }

    function addWordFeedEvent(g, surgeGain, isNewRecord) {
      const isHot = g.isWin || g.rank !== null || surgeGain || isNewRecord;
      feedEvents.unshift({
        kind: "word",
        word: g.word,
        pseudo: g.finderPseudo,
        temp: g.temp,
        rank: g.rank,
        isWin: g.isWin,
        surgeGain,
        isHot
      });
      if (feedEvents.length > 40) feedEvents.pop();
      renderFeed();

      if (isHot && document.getElementById("socialSection").classList.contains("hidden")) {
        document.getElementById("unreadDot").classList.remove("hidden");
      }
    }

    function addSystemFeedEvent(text) {
      feedEvents.unshift({ kind: "system", text, isHot: true });
      if (feedEvents.length > 40) feedEvents.pop();
      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById("liveFeed");
      const filtered = feedOnlyHot ? feedEvents.filter(e => e.isHot) : feedEvents;

      if (filtered.length === 0) {
        feed.innerHTML = `<p class="text-slate-500 text-[11px] text-center my-auto py-6">Aucun événement.</p>`;
        return;
      }

      feed.innerHTML = filtered.map(ev => {
        if (ev.kind === "system") {
          return `<div class="px-2.5 py-1.5 rounded-lg bg-slate-800/40 border border-slate-800 text-[11px] text-sky-300 font-medium">${escapeHTML(ev.text)}</div>`;
        }

        const badge = ev.isWin
          ? `<span class="text-emerald-300 font-bold">🏆</span>`
          : ev.surgeGain
            ? `<span class="text-amber-300 font-bold">+${ev.surgeGain}%</span>`
            : ev.rank
              ? `<span class="text-purple-300">${ev.rank}‰</span>`
              : "";

        const rowStyle = ev.isWin
          ? "bg-emerald-950/40 border-emerald-500/40"
          : ev.surgeGain
            ? "bg-amber-950/35 border-amber-500/40"
            : ev.rank
              ? "bg-purple-950/25 border-purple-500/30"
              : "bg-slate-800/30 border-slate-800/70";

        return `
          <div class="px-2.5 py-1.5 rounded-lg border ${rowStyle} flex items-center justify-between gap-2 text-[11px]">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="text-slate-400 truncate max-w-[70px]">${escapeHTML(ev.pseudo)}</span>
              <strong class="text-slate-100 capitalize truncate">${escapeHTML(ev.word)}</strong>
            </div>
            <div class="flex items-center gap-1.5 font-mono-num shrink-0">
              ${badge}
              <span class="font-bold text-slate-200">${ev.temp.toFixed(1)}°C</span>
            </div>
          </div>
        `;
      }).join("");
    }

    function showToast(message, color = "sky") {
      const container = document.getElementById("toastContainer");
      const colors = {
        sky: "bg-sky-950/95 border-sky-500/50 text-sky-100",
        amber: "bg-amber-950/95 border-amber-500/60 text-amber-100",
        rose: "bg-rose-950/95 border-rose-500/60 text-rose-100",
        emerald: "bg-emerald-950/95 border-emerald-500/60 text-emerald-100"
      };
      const toast = document.createElement("div");
      toast.className = `px-3 py-1.5 rounded-xl border shadow-xl backdrop-blur-md text-xs font-semibold text-center animate-pop ${colors[color] || colors.sky}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.2s ease";
        setTimeout(() => toast.remove(), 200);
      }, 2200);
    }

    function clearInput() {
      const input = document.getElementById("wordInput");
      input.value = "";
      input.focus();
    }

    function switchMobileTab(tab) {
      const gameSec = document.getElementById("gameSection");
      const socialSec = document.getElementById("socialSection");
      const btnGame = document.getElementById("tabGameBtn");
      const btnSocial = document.getElementById("tabSocialBtn");

      if (tab === "game") {
        gameSec.classList.remove("hidden");
        socialSec.classList.add("hidden");
        btnGame.className = "py-1 rounded-lg bg-slate-800 text-white transition flex items-center justify-center gap-1.5";
        btnSocial.className = "py-1 rounded-lg text-slate-400 transition flex items-center justify-center gap-1.5 relative";
      } else {
        gameSec.classList.add("hidden");
        socialSec.classList.remove("hidden");
        socialSec.classList.add("flex");
        document.getElementById("unreadDot").classList.add("hidden");
        btnSocial.className = "py-1 rounded-lg bg-slate-800 text-white transition flex items-center justify-center gap-1.5 relative";
        btnGame.className = "py-1 rounded-lg text-slate-400 transition flex items-center justify-center gap-1.5";
      }
    }
  </script>
</body>
